<style>
:root{
  --bg:#FAFAFA;--card:#FFFFFF;--muted:#6B7280;--accent:#3B1E54;--secondary:#9B7EBD;--light:#EEEEEE;--radius:12px;--shadow:0 6px 18px rgba(11,15,25,0.06);font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}
html,body{height:100%;margin:0;background:var(--bg);color:#111827;}
.container{max-width:920px;margin:36px auto;padding:22px;}
header{display:flex;justify-content:space-between;margin-bottom:18px;}
.brand{display:flex;gap:14px;align-items:center;}

p.lead{margin:0;color:var(--muted);font-size:13px;}
main.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}

.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--light);}
.section-title{display:flex;justify-content:space-between;margin-bottom:12px;}
.section-title h2{margin:0;font-size:16px;}
.score{font-weight:700;color:var(--accent);font-size:20px;}
.mistake-item {
  margin-bottom: 12px;
  padding: 8px 12px;
  border: 1px solid var(--light);
  border-radius: 8px;
  background-color: #f9f9f9;
}

.mistake-item .q-key {
  font-weight: 600;
  margin-bottom: 6px;
}

.mistake-item .answer-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 10px;
  background: #eeeeee;

}
.muted{color:var(--muted);font-size:13px;}
.writing-wrap{grid-column:1/-1;}

.controls{display:flex;gap:10px;align-items:center;margin-top:14px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;border:none;background: var(--accent);color:white;}
.btn.secondary{background:transparent;color: var(--accent);border:1px solid var(--light);font-weight:600;}

.back-btn-fixed {

  align-items: center;

  font-weight: 600;

  background: var(--secondary, #9B7EBD);
}

.writing-question-box {

  border: 1px solid var(--light);
  padding: 12px;
  border-radius: 10px;
  margin-top: 8px;
  margin-bottom: 8px;
}

.task-image {
  width: 100%;
  max-width: 480px;
  border-radius: 8px;
  display: block;
  margin-bottom: 10px;
}

.question-text {
  font-weight: 600;
  white-space: pre-wrap;
  font-size: 14px;
  line-height: 1.5;
}


/* Loading Overlay */
#loadingOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.9); display: none;
    flex-direction: column; align-items: center; justify-content: center; z-index: 10000;
}
.spinner { width: 50px; height: 50px; border: 5px solid var(--light); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Feedback Side-by-Side */
.feedback-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
.feedback-card { background: #fdfdfd; border: 1px dashed var(--secondary); padding: 15px; border-radius: 8px; }
.editable-score { width: 60px; padding: 5px; border-radius: 4px; border: 1px solid var(--light); font-weight: bold; }
.edit-area { width: 100%; min-height: 100px; font-family: inherit; font-size: 13px; border: 1px solid var(--light); padding: 8px; margin-top: 5px; border-radius: 6px; }

/* Category Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; margin-bottom: 5px; }
.tag-err { background: #ef4444; }
.tag-sug { background: #3b82f6; }

/* Scoring Grid */
.criteria-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin: 15px 0;
}
.criteria-item {
    background: #f3f4f6;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
}
.criteria-item label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
}

/* Dynamic Correction Table */
.correction-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
.correction-table th {
    text-align: left;
    font-size: 12px;
    padding: 8px;
    background: #f9fafb;
    border-bottom: 2px solid var(--light);
}
.correction-table td {
    padding: 8px;
    border-bottom: 1px solid var(--light);
    vertical-align: top;
}
.row-action {
    color: #ef4444;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
}
.add-row-btn {
    margin-top: 10px;
    font-size: 12px;
    padding: 4px 10px;
    background: var(--light);
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>

(async function(){

/**
 * Downloads an image from a URL and converts it to a Base64 string.
 * @param {string} url - The source URL of the image.
 * @returns {Promise<string>} - Base64 encoded image data.
 */
async function getBase64FromUrl(url) {
    if (!url) return null;
    // If it's already base64, return it
    if (url.startsWith('data:image')) return url.split(',')[1];

    try {
        const response = await fetch(url);
        const blob = await response.blob();
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
                // Remove the "data:image/jpeg;base64," prefix for the API
                const base64String = reader.result.split(',')[1];
                resolve(base64String);
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    } catch (error) {
        console.error("Failed to download image:", error);
        return null;
    }
}
// --- NEW EVALUATION FUNCTION ---
document.getElementById('evaluateBtn').addEventListener('click', runEvaluation);
async function runEvaluation() {
    const loader = document.getElementById('loadingOverlay');
    loader.style.display = 'flex';
    
    // Clear old feedback
    document.querySelectorAll('.feedback-section').forEach(el => el.remove());

    try {
        const imgUrl = document.getElementById('task1Image').src;
        const base64Image = await getBase64FromUrl(imgUrl);

        // Prepare ONE payload for BOTH tasks
        const payload = {
            task1_text: document.getElementById('task1Answer').innerText,
            task1_image: base64Image,
            task2_text: document.getElementById('task2Answer').innerText
        };

        const response = await fetch("http://caboose.proxy.rlwy.net:30618/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.status !== 200) throw new Error(data.detail || "Server Error");

        // Render both sections using the data returned (data.task1 and data.task2)
        renderFeedbackUI(data.task1, 'task1Answer', 'Task 1');
        renderFeedbackUI(data.task2, 'task2Answer', 'Task 2');

    } catch (e) {
        console.error(e);
        alert("Evaluation failed: " + e.message);
    } finally {
        loader.style.display = 'none';
    }
}

function renderFeedbackUI(data, targetId, title) {
    const targetEl = document.getElementById(targetId);
    
    // Safety defaults for criteria scores
    const scores = data.criteria_scores || { 
        task_response: 0, coherence_cohesion: 0, lexical_resource: 0, grammatical_range: 0 
    };

    const html = `
        <div class="feedback-section" style="margin-top: 25px; border: 1px solid var(--secondary); padding: 20px; border-radius: 12px; background: #fff;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; color:var(--accent);">${title} Examiner Dashboard</h3>
                <div style="background:var(--accent); color:white; padding:5px 15px; border-radius:20px; font-weight:700;">
                    Overall: <input type="number" step="0.5" class="editable-score overall-band" style="background:transparent; color:white; border:none; width:45px;" value="${data.band_score || 0}">
                </div>
            </div>

            <div class="criteria-grid">
                ${Object.entries(scores).map(([key, val]) => `
                    <div class="criteria-item">
                        <label>${key.replace('_', ' ')}</label>
                        <input type="number" step="0.5" class="editable-score crit-val" data-key="${key}" value="${val}" style="width:50px; text-align:center;">
                    </div>
                `).join('')}
            </div>

            <label class="muted">Detailed Evaluation</label>
            <textarea class="edit-area feedback-text" style="height:80px;">${data.detailed_feedback || ''}</textarea>

            <label class="muted" style="margin-top:15px; display:block;">Error & Correction Analysis</label>
            <table class="correction-table">
                <thead>
                    <tr><th>Original</th><th>Correction</th><th>Explanation</th><th></th></tr>
                </thead>
                <tbody class="correction-body">
                    ${(data.errors || []).map(e => `
                        <tr>
                            <td contenteditable="true">${e.original}</td>
                            <td contenteditable="true">${e.correction}</td>
                            <td contenteditable="true">${e.explanation}</td>
                            <td class="row-action" onclick="this.parentElement.remove()">×</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
            <button class="add-row-btn" onclick="addCorrectionRow(this)">+ Add Correction</button>

            <label class="muted" style="margin-top:15px; display:block;">Final Suggestions</label>
            <textarea class="edit-area suggestions-text" style="height:60px;">${(data.suggestions || []).join('\n')}</textarea>
        </div>
    `;
    targetEl.insertAdjacentHTML('afterend', html);
}

// Utility for teachers to add manual rows

  function renderMistakesList(container, mistakes){
  container.innerHTML = '';
  
  if(!mistakes || Object.keys(mistakes).length === 0){
    const li = document.createElement('li'); 
    li.className = 'muted'; 
    li.textContent = 'No mistakes recorded.'; 
    container.appendChild(li);
    return;
  }

  Object.entries(mistakes).forEach(([key, obj]) => {

    answerBlock.appendChild(correctAnswer);

    li.appendChild(answerBlock);
    container.appendChild(li);
  });

  const { jsPDF } = window.jspdf; // Make jsPDF available


async function downloadWritingPDF() {
  const task1ImageEl = document.getElementById("task1Image");
  const task1Image = task1ImageEl?.src || "";
  const task1Question = document.getElementById("task1Question")?.textContent || "";
  const task1Answer = document.getElementById("task1Answer")?.textContent || "";

  const task2Question = document.getElementById("task2Question")?.textContent || "";
  const task2Answer = document.getElementById("task2Answer")?.textContent || "";

  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const margin = 20;

  let y = 15;

  const addText = (text, pdf, x, y, lineHeight = 7, maxWidth = pageWidth - 2 * margin) => {
    const lines = pdf.splitTextToSize(text, maxWidth);
    for (let i = 0; i < lines.length; i++) {
      if (y + lineHeight > pageHeight - margin) {
        pdf.addPage();
        y = margin;
      }
      pdf.text(lines[i], x, y);
      y += lineHeight;
    }
    return y;
  };

  // ---------- Task 1 Page ----------
  pdf.setFontSize(24);
  pdf.text("Writing Task 1", margin, y);
  y += 12;

  if (task1Image) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = task1Image;
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = rej;
    });

    const imgProps = pdf.getImageProperties(img);
    const imgRatio = imgProps.width / imgProps.height;
    const imgWidth = pageWidth - 2 * margin;
    let imgHeight = imgWidth / imgRatio;

    if (imgHeight > 80) imgHeight = 80; // Cap height for layout

    pdf.addImage(img, 'JPEG', margin, y, imgWidth, imgHeight);
    y += imgHeight + 10;
  }

  pdf.setFont(undefined, 'bold');
  pdf.text("Question:", margin, y);
  y += 7;
  pdf.setFont(undefined, 'normal');
  pdf.setFontSize(10);
  y = addText(task1Question, pdf, margin, y);

  y += 5;
  pdf.setFontSize(12);
  pdf.setFont(undefined, 'bold');
  pdf.text("Student Answer:", margin, y);
  y += 7;
  pdf.setFont(undefined, 'normal');
  pdf.setFontSize(10);
  y = addText(task1Answer, pdf, margin, y);

  // ---------- Task 2 Page ----------
  pdf.addPage();
  y = margin;
  pdf.setFontSize(24);
  pdf.text("Writing Task 2", margin, y);
  y += 12;

  pdf.setFont(undefined, 'bold');
  pdf.text("Question:", margin, y);
  y += 7;
  pdf.setFont(undefined, 'normal');
  pdf.setFontSize(10);
  y = addText(task2Question, pdf, margin, y);

  y += 5;
  pdf.setFontSize(12);
  pdf.setFont(undefined, 'bold');
  pdf.text("Student Answer:", margin, y);
  y += 7;
  pdf.setFont(undefined, 'normal');
  pdf.setFontSize(10);
  y = addText(task2Answer, pdf, margin, y);

  // ---------- FEEDBACK SECTIONS ----------
  document.querySelectorAll('.feedback-section').forEach((section, idx) => {
    pdf.addPage();
    y = 20;

    pdf.setFontSize(20);
    pdf.setTextColor(44, 62, 80); // Professional Dark Blue
    pdf.text(`Examiner Report: Task ${idx + 1}`, margin, y);
    y += 12;

    // 1. Scores Grid
    const overall = section.querySelector('.overall-band').value;
    pdf.setFontSize(14);
    pdf.text(`Overall Band Score: ${overall}`, margin, y);
    y += 10;

    const critInputs = section.querySelectorAll('.crit-val');
    pdf.setFontSize(10);
    pdf.setTextColor(100);
    critInputs.forEach(input => {
      pdf.text(`${input.previousElementSibling.innerText}: ${input.value}`, margin, y);
      y += 6;
    });

    // 2. Detailed Feedback
    y += 6;
    pdf.setTextColor(0);
    pdf.setFont(undefined, 'bold');
    pdf.text("Examiner Comments:", margin, y);
    y += 7;
    pdf.setFont(undefined, 'normal');
    const feedbackText = section.querySelector('.feedback-text').value;
    y = addText(feedbackText, pdf, margin, y, 6, 175);

    // 3. THE CORRECTION TABLE (Using autoTable)
    y += 10;
    pdf.setFont(undefined, 'bold');
    pdf.text("Detailed Corrections:", margin, y);
    
    const rows = section.querySelectorAll('.correction-body tr');
    const tableData = [];
    
    rows.forEach(row => {
      const cells = row.querySelectorAll('td');
      if (cells.length >= 3) {
        tableData.push([
          cells[0].innerText.trim(), // Original
          cells[1].innerText.trim(), // Correction
          cells[2].innerText.trim()  // Explanation
        ]);
      }
    });

    pdf.autoTable({
      startY: y + 5,
      head: [['Original Text', 'Suggested Correction', 'Explanation']],
      body: tableData,
      theme: 'striped',
      headStyles: { fillGray: [44, 62, 80], textColor: 255, fontStyle: 'bold' },
      styles: { fontSize: 9, cellPadding: 3, overflow: 'linebreak' },
      columnStyles: {
        0: { cellWidth: 50 }, // Original
        1: { cellWidth: 50 }, // Correction
        2: { cellWidth: 'auto' } // Explanation gets the rest
      },
      margin: { left: margin, right: margin }
    });

    // Update Y for suggestions based on where table ended
    y = pdf.lastAutoTable.finalY + 12;

    // 4. Suggestions
    pdf.setFont(undefined, 'bold');
    pdf.text("Key Suggestions for Improvement:", margin, y);
    y += 7;
    pdf.setFont(undefined, 'normal');
    const suggestionsText = section.querySelector('.suggestions-text').value;
    addText(suggestionsText, pdf, margin, y, 6, 175);
  });

  pdf.save(`IELTS_Writing_${candidatePasscode}.pdf`);
}

  // This MUST be global (outside any other function or async block)
function addCorrectionRow(btn) {
    const section = btn.closest('.feedback-section');
    const tbody = section.querySelector('.correction-body');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td contenteditable="true"></td>
        <td contenteditable="true"></td>
        <td contenteditable="true"></td>
        <td class="row-action" style="text-align:center;" onclick="this.parentElement.remove()">×</td>
    `;
    tbody.appendChild(row);
}

</script>
