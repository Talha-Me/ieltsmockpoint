<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Smart Lesson Publisher - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #334155;
      padding-bottom: 60px;
    }
    .top-header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 0;
      margin-bottom: 24px;
    }
    .glass-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .form-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .form-control, .form-select {
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      padding: 9px 13px;
      font-size: 0.93rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .quick-chip {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-chip:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    /* Live Preview Elements */
    .preview-box {
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 14px;
      min-height: 520px;
      padding: 22px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .preview-content h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 18px;
      margin-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 6px;
    }
    .preview-content h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .preview-content p {
      font-size: 0.98rem;
      line-height: 1.75;
      color: #334155;
      margin-bottom: 12px;
    }
    .preview-content ul, .preview-content ol {
      padding-left: 22px;
      margin-bottom: 14px;
    }
    .preview-content li {
      margin-bottom: 5px;
      line-height: 1.6;
    }
    .preview-tip-box {
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin: 14px 0;
      color: #1e40af;
      font-weight: 500;
    }
    .preview-warn-box {
      background: #fff1f2;
      border-left: 4px solid #e11d48;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin: 14px 0;
      color: #9f1239;
      font-weight: 500;
    }
    .preview-band9-box {
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      border-radius: 10px;
      padding: 14px 18px;
      margin: 16px 0;
    }
    .preview-band9-box h4 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #15803d;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header text-white">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-primary px-3 py-2 fs-6 rounded-pill"><i class="fa fa-graduation-cap"></i> Admin</span>
        <h4 class="fw-bold mb-0 text-white">IELTS Smart Lesson Creator</h4>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-info rounded-pill px-3 fw-semibold btn-sm" onclick="loadExistingLessons()">
          <i class="fa fa-list me-1"></i> View Saved Lessons
        </button>
        <a href="/learn" target="_blank" class="btn btn-outline-light rounded-pill px-3 fw-semibold btn-sm">
          <i class="fa fa-external-link me-1"></i> Live Hub
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="row g-4">
      
      <!-- Left Column: Input Form -->
      <div class="col-lg-6">
        <div class="glass-card p-4">
          <form id="autoLessonForm">
            
            <div class="row g-3">
              <!-- Module, Number, Level -->
              <div class="col-md-4">
                <label class="form-label">Module</label>
                <select id="module" class="form-select fw-bold text-primary">
                  <option value="listening">🎧 Listening</option>
                  <option value="reading" selected>📖 Reading</option>
                  <option value="writing">✍️ Writing</option>
                  <option value="speaking">🗣️ Speaking</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Lesson No.</label>
                <input type="number" id="lessonNumber" class="form-control text-center fw-bold" value="1" min="1" required>
              </div>

              <div class="col-md-4">
                <label class="form-label">Target Level</label>
                <select id="difficulty" class="form-select">
                  <option value="Beginner">Band 5.5 - 6.0</option>
                  <option value="Intermediate" selected>Band 6.5 - 7.0</option>
                  <option value="Advanced">Band 7.5 - 8.0</option>
                  <option value="Band 8+">Band 8.5 - 9.0</option>
                </select>
              </div>

              <!-- Title -->
              <div class="col-12">
                <label class="form-label">Lesson Title</label>
                <input type="text" id="title" class="form-control form-control-lg fw-bold" placeholder="e.g. Master Map & Diagram Labelling in 4 Steps" required>
              </div>

              <!-- Media Links -->
              <div class="col-md-6">
                <label class="form-label"><i class="fa fa-music text-primary me-1"></i> Audio URL (R2 .mp3)</label>
                <input type="url" id="audioUrl" class="form-control" placeholder="https://pub-xxxx.r2.dev/audio.mp3">
              </div>

              <div class="col-md-6">
                <label class="form-label"><i class="fa fa-image text-success me-1"></i> Image / Visual URL</label>
                <input type="url" id="thumbnail" class="form-control" placeholder="https://upload.wikimedia.org/.../image.jpg">
              </div>

              <!-- Summary -->
              <div class="col-12">
                <label class="form-label">Short Summary (Shows on card)</label>
                <textarea id="summary" class="form-control" rows="2" placeholder="Key objectives and exam rules covered in this lesson..."></textarea>
              </div>

              <!-- Smart Content Area -->
              <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="form-label mb-0">Lesson Content (Plain Text Smart Formatter)</label>
                  <span class="small text-muted">HTML ট্যাগ লেখার প্রয়োজন নেই</span>
                </div>

                <!-- Formatting Helpers -->
                <div class="d-flex flex-wrap gap-1 mb-2">
                  <span class="quick-chip" onclick="insertHelper('## Strategy Heading')"><i class="fa fa-heading"></i> Heading</span>
                  <span class="quick-chip" onclick="insertHelper('- Bullet point step')"><i class="fa fa-list-ul"></i> Bullet</span>
                  <span class="quick-chip" onclick="insertHelper('> Tip: Focus on keyword paraphrasing')"><i class="fa fa-lightbulb"></i> Tip Box</span>
                  <span class="quick-chip" onclick="insertHelper('! Warning: Do not exceed the word limit')"><i class="fa fa-exclamation-triangle"></i> Warning</span>
                  <span class="quick-chip" onclick="insertHelper('[band9]\nSample Band 9 Model Response goes here...\n[/band9]')"><i class="fa fa-award"></i> Band 9 Box</span>
                </div>

                <textarea id="rawContent" class="form-control" rows="12" placeholder="এখানে সরাসরি সাধারণ টেক্সট লিখুন।&#10;&#10;## দিয়ে হেডিং দিন&#10;- দিয়ে বুলেট পয়েন্ট দিন&#10;1. দিয়ে সংখ্যা অনুযায়ী স্টেপ দিন&#10;> দিয়ে টিপস বক্স দিন&#10;! দিয়ে সতর্কবার্তা বক্স দিন&#10;**text** দিলে লেখা বোল্ড হবে&#10;[band9]...[/band9] দিলে মডেল অ্যান্সার বক্স তৈরি হবে" required></textarea>
              </div>

              <!-- Submit Button -->
              <div class="col-12 pt-1">
                <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                  <i class="fa fa-paper-plane me-1"></i> Publish Lesson to Website
                </button>
              </div>

            </div>
          </form>
        </div>
      </div>

      <!-- Right Column: Live Student Screen Preview -->
      <div class="col-lg-6">
        <div class="glass-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-dark mb-0"><i class="fa fa-eye text-primary me-2"></i> Live Student Preview</h5>
            <span class="badge bg-success-subtle text-success fw-bold px-3 py-1 rounded-pill">Real-time</span>
          </div>

          <div class="preview-box">
            <div class="d-flex gap-2 align-items-center mb-2">
              <span class="badge bg-primary" id="prevLessonNum">Lesson 1</span>
              <span class="badge bg-secondary" id="prevDifficulty">Intermediate</span>
            </div>

            <h3 class="fw-extrabold text-dark mb-3" id="prevTitle">Lesson Title Preview</h3>

            <!-- Audio Player Preview -->
            <div id="prevAudioContainer" class="p-2 bg-white rounded border mb-3" style="display: none;">
              <small class="text-primary fw-bold d-block mb-1"><i class="fa fa-volume-up"></i> Audio Attached</small>
              <audio id="prevAudioPlayer" controls class="w-100" style="height: 38px;"></audio>
            </div>

            <!-- Image Preview -->
            <img id="prevImg" src="" alt="Preview" class="img-fluid rounded border mb-3 w-100" style="max-height: 250px; object-fit: contain; display: none;">

            <!-- Rendered HTML Content -->
            <div class="preview-content" id="prevContent">
              <p class="text-muted fst-italic">বাঁ পাশের ঘরে লিখলেই এখানে স্বয়ংক্রিয়ভাবে শিক্ষার্থীদের পড়ার মতো প্রিভিউ আসবে...</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // Smart Plain Text Parser
    function convertTextToHtml(raw) {
      if (!raw) return "";
      
      // Handle Band 9 blocks first
      raw = raw.replace(/\[band9\]([\s\S]*?)\[\/band9\]/g, (match, p1) => {
        return `<div class="preview-band9-box"><h4><i class="fa fa-award me-1"></i> Band 9 Model Response</h4><p class="mb-0 fst-italic">${p1.trim().replace(/\n/g, "<br>")}</p></div>`;
      });

      const lines = raw.split("\n");
      let html = "";
      let inUl = false;
      let inOl = false;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        // Convert bold syntax (**bold**)
        line = line.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

        if (line.startsWith("## ")) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += `<h2>${line.replace("## ", "")}</h2>`;
        } else if (line.startsWith("### ")) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += `<h3>${line.replace("### ", "")}</h3>`;
        } else if (line.startsWith("> ")) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += `<div class="preview-tip-box"><i class="fa fa-lightbulb me-1"></i> ${line.replace("> ", "")}</div>`;
        } else if (line.startsWith("! ")) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += `<div class="preview-warn-box"><i class="fa fa-exclamation-triangle me-1"></i> ${line.replace("! ", "")}</div>`;
        } else if (line.startsWith("- ") || line.startsWith("* ")) {
          if (inOl) { html += "</ol>"; inOl = false; }
          if (!inUl) { html += "<ul>"; inUl = true; }
          html += `<li>${line.substring(2)}</li>`;
        } else if (/^\d+\.\s/.test(line)) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (!inOl) { html += "<ol>"; inOl = true; }
          html += `<li>${line.replace(/^\d+\.\s/, "")}</li>`;
        } else if (line.startsWith("<div class=\"preview-band9-box\"")) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += line;
        } else if (line.length > 0) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += `<p>${line}</p>`;
        } else {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
        }
      }
      if (inUl) html += "</ul>";
      if (inOl) html += "</ol>";
      return html;
    }

    function updatePreview() {
      const title = document.getElementById("title").value.trim() || "Lesson Title Preview";
      const lessonNum = document.getElementById("lessonNumber").value || "1";
      const diff = document.getElementById("difficulty").value;
      const audio = document.getElementById("audioUrl").value.trim();
      const img = document.getElementById("thumbnail").value.trim();
      const raw = document.getElementById("rawContent").value;

      document.getElementById("prevTitle").textContent = title;
      document.getElementById("prevLessonNum").textContent = `Lesson ${lessonNum}`;
      document.getElementById("prevDifficulty").textContent = diff;

      // Audio Preview
      const audioBox = document.getElementById("prevAudioContainer");
      const audioPlayer = document.getElementById("prevAudioPlayer");
      if (audio) {
        audioBox.style.display = "block";
        audioPlayer.src = audio;
      } else {
        audioBox.style.display = "none";
      }

      // Image Preview
      const imgTag = document.getElementById("prevImg");
      if (img) {
        imgTag.src = img;
        imgTag.style.display = "block";
      } else {
        imgTag.style.display = "none";
      }

      // Content Preview
      document.getElementById("prevContent").innerHTML = convertTextToHtml(raw) || `<p class="text-muted fst-italic">বাঁ পাশের ঘরে লিখলেই এখানে স্বয়ংক্রিয়ভাবে শিক্ষার্থীদের পড়ার মতো প্রিভিউ আসবে...</p>`;
    }

    function insertHelper(text) {
      const ta = document.getElementById("rawContent");
      const start = ta.selectionStart;
      ta.value = ta.value.substring(0, start) + "\n" + text + "\n" + ta.value.substring(start);
      ta.focus();
      updatePreview();
    }

    async function loadExistingLessons() {
      const mod = document.getElementById("module").value;
      try {
        const res = await fetch(`/api/lessons?module=${mod}`);
        const data = await res.json();
        if (data.success && data.data.length > 0) {
          const list = data.data.map(l => `#${l.lessonNumber}: ${l.title}`).join("\n");
          alert(`Existing ${mod.toUpperCase()} Lessons:\n\n` + list);
        } else {
          alert(`No lessons found for module: ${mod}`);
        }
      } catch (e) {
        alert("Failed to fetch lessons list");
      }
    }

    // Attach real-time input listeners
    ["title", "lessonNumber", "difficulty", "audioUrl", "thumbnail", "rawContent"].forEach(id => {
      document.getElementById(id).addEventListener("input", updatePreview);
    });

    // Form Submission with Slug Generation
    document.getElementById("autoLessonForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Publishing...`;

      const rawTitle = document.getElementById("title").value.trim();
      const raw = document.getElementById("rawContent").value.trim();
      const structuredHtml = convertTextToHtml(raw);

      // Generate clean unique slug to prevent E11000 duplicate key error
      const generatedSlug = rawTitle
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)+/g, '') + '-' + Date.now();

      const payload = {
        module: document.getElementById("module").value,
        lessonNumber: Number(document.getElementById("lessonNumber").value),
        difficulty: document.getElementById("difficulty").value,
        title: rawTitle,
        slug: generatedSlug,
        audioUrl: document.getElementById("audioUrl").value.trim(),
        thumbnail: document.getElementById("thumbnail").value.trim(),
        summary: document.getElementById("summary").value.trim(),
        content: structuredHtml
      };

      try {
        const res = await fetch("/api/lessons", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          alert("🎉 Lesson published successfully!");
          document.getElementById("lessonNumber").value = Number(payload.lessonNumber) + 1;
          document.getElementById("title").value = "";
          document.getElementById("audioUrl").value = "";
          document.getElementById("thumbnail").value = "";
          document.getElementById("rawContent").value = "";
          document.getElementById("summary").value = "";
          updatePreview();
        } else {
          alert("Error: " + (data.message || data.error || "Failed to publish"));
        }
      } catch (err) {
        alert("Server request failed: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa fa-paper-plane me-1"></i> Publish Lesson to Website`;
      }
    });
  </script>
</body>
</html>
