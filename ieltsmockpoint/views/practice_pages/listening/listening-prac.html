  <title>IELTS Listening Test</title>

<body>
<button id="highlight-btn"><img src="https://i.ibb.co/ym9KSdkd/marker.png" alt="highlighter" border="0" style="width: 20px; height: 20px; padding-bottom: 5px;"></button>
  <!-- top navbar -->


  <div class="navbar-custom">
    <div class="nav-left-section">
    <button id="backBtn" class="btn btn-outline-dark btn-sm">
      <i class="bi bi-chevron-left"></i> Back
    </button>
  </div>

  <div class="nav-center-section">
    <div id="score-container" class="nav-score-card">
      <span class="score-label">Score</span>
      <span class="score-value">
        <span id="user-score">0</span> / <span id="total-questions">0</span>
      </span>
    </div>
  </div>

    
    <div class="navbar-right">
      <button id="finishBtn" name="submit-button" form="quiz-form" class="btn btn-outline-dark btn-sm">Finish test</button>
      <button class="bi bi-wifi btn-flat"></button>
      <button class="bi bi-gear btn-flat" onclick="settingsMenu()"></button>
      <button class="bi bi-journal-text btn-flat" onclick="openNotes()"></button>
      
    </div>
  </div>
  <!--popup menu for changin font-size-->
  <div class="popup-settings menu-hidden" id="popup-settings">
    <div class="popup-content">
      <h3>Settings</h3>
      <button class="close-settings" onclick="closeSettings()">X</button>
      <form class="settings-form">
        <label for="font-size-selector">Select Font-size:</label>
        <select id="font-size-selector">
          <option value="14px">small</option>
          <option value="18px" selected>medium</option>
          <option value="24px">large</option>
        </select>
      </form>
    </div>
  </div>
<!--popup menu for changin font-size-->

  <!--fullscreen checker-->
<div id="fullscreen-warning-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
  <div style="background:#fff; padding:2em; border-radius:8px; text-align:center;">
    <p>Warning: You have exited fullscreen. Please stay in fullscreen during the test.</p>
    <p><strong>Pressing OK will END THE TEST.</strong></p>
    <button class="submit-ok-button" id="fullscreen-ok-btn">OK</button>
    <button class="submit-stay-button" id="fullscreen-stay-btn">Stay</button>
  </div>
</div>

  <!--Submit before Confirmation-->
<div id="submit-warning-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
  <div style="background:#fff; padding:2em; border-radius:8px; text-align:center;">
    <p>You have attempted to FINISH the Test</p>
    <p><strong>Pressing OK will END THE TEST.</strong></p>
    <button class="submit-ok-button" id="submit-ok-btn">OK</button>
    <button class= "submit-stay-button" id="submit-stay-btn">Stay</button>
  </div>
</div>


  <!--popup menu for taking notes-->
   <div class="popup-note menu-hidden" id="popup-note">
    <h3>Notes</h3>
    <button class="close-settings" onclick="closeSettings()">X</button>
    <textarea id="notesArea" rows="100" cols="55" placeholder="Write your notes here....."></textarea>  
   </div>

  <!--popup menu for taking notes-->
  
   <!--popup to start listening-->
   <!-- Listening Test Popup Snippet -->
   <!--popup to start listening-->


  <!--this whole section will be dynamically handledddddddddddddd-->
  <form id="quiz-form" onkeydown="if(event.keyCode === 13) {
     return false;}">
  <div class="test-content" id="test-content">


  <div class="part-1 part" id="part-1" style="display:block">
    <div class="part-header">
      <audio id="listening-practice-audio"  controls></audio>
      <p id="part-header-p" class="part-header-p">Listen and answer question 1 - 10.</p> 
</div>
   <div class="part-margin" id="part-margin-1">
    <!--Dynamically added--> 
  </div>
  </div>

<div id="unhighlightPopup" class="unhighlight-popup">Unhighlight</div>
</div>




  
</form>
