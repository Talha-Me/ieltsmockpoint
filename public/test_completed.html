<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="mpfavicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IELTS Test Completed | IELTS Mockpoint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0b2b52;--blue:#1565c9;--blue-light:#eaf2fd;--red:#e0202d;--red-dark:#b5121d;--surface:#f4f7fb;--muted:#5d708c;--line:#e3e9f3;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      min-height:100vh;min-height:100dvh;
      background:var(--surface);
      display:flex;align-items:center;justify-content:center;
      font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
      padding:24px;position:relative;overflow:hidden;
    }
    .shape{position:absolute;border-radius:50%;pointer-events:none;}
    .s1{width:520px;height:520px;top:-180px;left:-140px;background:radial-gradient(circle,#dbe9fb,transparent 70%);animation:float 9s ease-in-out infinite;}
    .s2{width:460px;height:460px;bottom:-160px;right:-120px;background:radial-gradient(circle,rgba(224,32,45,.10),transparent 70%);animation:float 11s ease-in-out infinite reverse;}
    @keyframes float{50%{transform:translateY(26px);}}

    .message-box{
      position:relative;z-index:1;
      background:#fff;width:100%;max-width:500px;
      border:1px solid var(--line);border-radius:24px;
      padding:44px 34px 38px;text-align:center;overflow:hidden;
      box-shadow:0 30px 70px rgba(11,43,82,.12);
      animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
    }
    .message-box::before{
      content:'';position:absolute;top:0;left:0;right:0;height:5px;
      background:linear-gradient(90deg,var(--blue),var(--red));
    }
    @keyframes rise{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:none;}}

    .logo{height:52px;width:auto;max-width:70%;object-fit:contain;display:block;margin:0 auto 26px;}
    .logo-fallback{display:none;justify-content:center;align-items:center;gap:8px;font-family:'Sora',sans-serif;font-weight:800;font-size:1.25rem;color:var(--navy);margin-bottom:26px;}
    .logo-fallback i{width:11px;height:11px;border-radius:3px;background:var(--red);box-shadow:5px 5px 0 var(--blue);margin-right:5px;}

    .check{position:relative;width:96px;height:96px;margin:0 auto 24px;}
    .check::before{
      content:'';position:absolute;inset:0;border-radius:50%;
      background:var(--blue-light);animation:pulse 2.4s ease-out infinite;
    }
    .check svg{position:relative;width:96px;height:96px;}
    .check circle{fill:var(--navy);transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) .25s both;}
    .check path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44;animation:draw .5s ease .75s forwards;}
    @keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
    @keyframes draw{to{stroke-dashoffset:0;}}
    @keyframes pulse{0%{transform:scale(1);opacity:.9;}100%{transform:scale(1.55);opacity:0;}}

    .message-box h1{
      font-family:'Sora',sans-serif;font-weight:800;letter-spacing:-.01em;
      font-size:1.9rem;line-height:1.15;color:var(--navy);margin-bottom:12px;
    }
    .message-box p{font-size:1.02rem;color:var(--muted);margin-bottom:30px;}

    .ok-btn{
      padding:13px 44px;background:var(--red);color:#fff;
      font-family:'Inter',sans-serif;font-size:1rem;font-weight:700;
      border:2px solid var(--red);border-radius:10px;cursor:pointer;
      transition:transform .15s,box-shadow .2s,background .2s,border-color .2s;
    }
    .ok-btn:hover{background:var(--navy);border-color:var(--navy);transform:translateY(-2px);box-shadow:0 12px 24px rgba(11,43,82,.25);}
    .ok-btn:active{transform:translateY(0);}

    @media(prefers-reduced-motion:reduce){*{animation:none!important;}.check path{stroke-dashoffset:0;}}
  </style>
</head>
<body>
  <div class="shape s1"></div><div class="shape s2"></div>

  <div class="message-box">
    <img class="logo" src="Brandlogo.png" alt="IELTS Mockpoint" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="logo-fallback"><i></i>IELTS Mockpoint</div>

    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="40"/><path d="M31 49l12 12 23-25"/></svg>
    </div>

    <h1>IELTS Test Completed</h1>
    <p>Thank you very much for your participation.</p>
    <button class="ok-btn" onclick="window.location.href='/'">OK</button>
  </div>
</body>
</html>
