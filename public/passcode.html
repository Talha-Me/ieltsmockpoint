<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%231A365D' /><path d='M30 25 V55 C30 65 35 75 50 75 C65 75 70 65 70 55 V25 H60 V55 C60 62 58 65 50 65 C42 65 40 62 40 55 V25 H30Z' fill='white' /><rect x='25' y='25' width='15' height='5' fill='white' /><rect x='60' y='25' width='15' height='5' fill='white' /></svg>">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passcode Input</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: linear-gradient(to bottom, #fafafa, #f3f4f6);
    }
    .card {
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }
    .input-field {
      width: 100%;
      position: relative;
      right: 12px;
      padding: 1rem;
      margin-top: 10px;
      border-radius: 0.75rem;
      border: 1px solid #d1d5db;
      font-size: 1.125rem;
      letter-spacing: 0.1em;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 4px rgba(156, 163, 175, 0.3);
    }
    .btn {
      margin-top: 1rem;
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 0.75rem;
      background: #111827;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1f2937;
    }
    .note {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
    }
.back-btn-fixed {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 9999;

  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px;
  border: 1px solid var(--light, #EEEEEE);
  background: #4AC3C7;
  color: #ffffff;
  cursor: pointer;
  transition: background 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
}

.back-btn-fixed:hover {
  background: #ffffff;
  color: #1E6F74;
}
  </style>
</head>
<body>
  <div class="card">
    <input id="candidateID" class="input-field" type="text" placeholder="Enter your Candidate ID" autofocus/>
    <input id="passcode" class="input-field" type="password" placeholder="Enter passcode"  />
    <button id="submitBtn" class="btn">Submit</button>
    
  </div>

  <!-- Back Button Template -->
<button class="back-btn-fixed">← Back</button>

  <script>
    // Get the query string (e.g., "?mockID=Academic-UKA-FINAL-3")
const queryString = window.location.search;

// Parse the parameters
const urlParams = new URLSearchParams(queryString);

// Get the specific value
const mockID = urlParams.get('mockID');

console.log(mockID); // Output: "Academic-UKA-FINAL-3"
    document.getElementById("submitBtn").addEventListener("click", async () => {
      const candidateID = document.getElementById("candidateID").value.trim();
      const passcode = document.getElementById("passcode").value;
      
      try {
        const response = await fetch("/api/submit-passcode", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ candidateID, passcode, mockID })
        });
        if(response.redirected){
          window.location.href = response.url;
        }

        if(!response.ok){
          alert("Wrong PASSCODE or CANDIDATE ID!");
        }

      } catch (error) {
        console.error("Error:", error);
        alert("An error occurred.");
      }
    });

  const backBtn = document.querySelector('.back-btn-fixed');
  if(backBtn){
    backBtn.addEventListener('click', () => {
      if(history.length > 1){
        history.back();
      } else {
        window.location.href = '/'; // fallback homepage
      }
    });
  }
  </script>
</body>
</html>
