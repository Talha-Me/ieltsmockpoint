    .addBorder{
      position: relative;
  padding: 0.75rem 1.5rem;
  border: 2px solid #999;
  border-radius: 8px;
  background-color: #fff;
  color: #333;
  font-weight: 500;
  transition: box-shadow 0.3s ease;
  background-clip: padding-box;
  /* animate border color via gradient with mask */
  background-image: linear-gradient(90deg, #999, #666, #999);
  background-size: 200% 100%;
  -webkit-background-clip: border-box;
  -webkit-text-fill-color: #333;
  animation: borderPulse 3s linear infinite;
    }

    .addBorder::after {
    content: "";
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  border-radius: 8px;
  border: 2px solid #999;
  background: linear-gradient(90deg, #999, #666, #999);
  background-size: 200% 200%;
  animation: borderPulse 3s linear infinite;
  z-index: -1;           /* put behind content */
  pointer-events: none;  /* let clicks pass through */
}

    @keyframes borderPulse {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }

}

function showLoading() {
  document.getElementById('loadingOverlay').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}


async function smartFetch(url, options = {}) {
  showLoading();
  try {
    const response = await fetch(url, options);
    return response;
  } catch (error) {
    console.error("Fetch error:", error);
    throw error;
  } finally {
    hideLoading();
  }
}
  function generateRandomStrings(number) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$&';
  const strings = [];

  for (let i = 0; i < number; i++) {
    let str = '';
    for (let j = 0; j < 12; j++) {
      str += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    strings.push(str);
  }

  return strings;
}


function toggleAssignedList(type) {
  const unusedList = document.getElementById("unusedList");

  const unusedButton = document.getElementById("assignButtonUnused");

  if (type === "used") {
    unusedList.classList.add("hidden");
    unusedButton.classList.remove("selected");
  } else {
    unusedList.classList.remove("hidden");
    unusedButton.classList.add("selected");
  }
}


    //format time function
    function formatReadableTime(isoString) {
    const date = new Date(isoString);

    // Extract components
    const hours = date.getHours();
    const minutes = date.getMinutes(); // optional if you want to include minutes
    const day = date.getDate();
    const month = date.toLocaleString('default', { month: 'long' }); // e.g., August
    const year = date.getFullYear();

    // Convert to 12-hour format
    const hour12 = hours % 12 || 12;
    const ampm = hours >= 12 ? 'pm' : 'am';

    return `${hour12}${ampm} ${day} ${month}, ${year}`;
}

    const passListDiv = document.getElementById("passList");
    passListDiv.innerHTML = ""; // Clear previous content

    const passList = document.createElement("ul");
    if (passCodes == "failed") {
      console.log("error getting passcodes!!");
    }

    passCodes.forEach((passcode, index) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <p id="passcode-${index}">${passcode.pass}</p>
        <input type="text" id="candidateID-${index}" class="candidate-input" placeholder="Candidate ID" />
        <button 
            type="button" 
            class="premium-toggle" 
            id="levelToggle-${index}" 
            onclick="this.classList.toggle('active'); this.innerText = this.classList.contains('active') ? 'Premium' : 'Free'">
            Free
        </button>
        <button onclick="assignCandidate(${index})" class="assign-button" id="assign-button">Assign</button>`;
      passList.appendChild(li);
    });

    passListDiv.appendChild(passList);
  }
}

function escapeSingleQuotes(str) {
  return str.replace(/'/g, "\\'");
}
    async function viewResults(){
      document.getElementById("userSection").style.display = "block";
      const userList = document.getElementById("userList");

      userList.innerHTML = '';
      const users = await postReqForViewingCandidates(data.username);


      users.reverse().forEach((user)=>{
        const userCard = document.createElement('div');
        userCard.className = 'user-card';
        const userPassCode = escapeSingleQuotes(user.passcode);
        userCard.innerHTML = `
          <div class="user-info">
            <span class="user-name">${user.username}</span>
            <span class="user-email">${user.passcode}</span>
          </div>
          
        `;
        if(user.mockInformation){
          userCard.innerHTML += `<button class="view-btn" data-id="${user.passcode}" onclick="redirectToResult('${userPassCode}')">View Result</button>`
        } else{
          userCard.innerHTML += `<button class="view-btn-grey" data-id="${user.passcode}" onclick="redirectToResult('${userPassCode}')" disabled>NOT ATTEMPTED</button>`
        }
        userList.appendChild(userCard);
      })


    }

    async function assignCandidate(passcodeID){
      const passcode = document.getElementById(`passcode-${passcodeID}`).textContent;
      const candidateID = document.getElementById(`candidateID-${passcodeID}`).value.trim();

      // Check if the toggle has the 'active' class
    const isPremium = document.getElementById(`levelToggle-${passcodeID}`).classList.contains('active');
    const level = isPremium ? "Premium" : "Free";


      const prefix = `${data.username}-roll-${candidateID}`;

      if(!candidateID){
        alert("Please Insert a Candidate ID");
      }else{
        const response = await postReqForInsertingCandidate(prefix, passcode, data.username, level);
        alert(response);
        await viewAssignedPasscodes();
        viewPassCodes();
        
      }
    }


    async function redirectToResult(passcode){
      await postReqForOpeningResultSession(passcode);
    }

    async function renderNotifications(){
      const notifData = await postReqForNotifications(data.username);
      const assignedData = await postReqForViewAssignedPasscodes(data.username);
      const pass = await postReqforViewAllPasscodes(data.username);
      const notifSection = document.getElementById("notifications");

      if(notifData.length < 1 && assignedData.length < 1){
        return
      }else{

      const usedIdList = document.getElementById("usedIdList");
      const testHistoryList = document.getElementById("testHistoryList");

      const usedIdSection = document.getElementById("usedIdSection");
      const testHistorySection = document.getElementById("testHistorySection");


      notifData.reverse().forEach((notif, idx)=>{
        testHistoryList.innerHTML += `
        <div class="notification-item">
        <div class="notification-row">
          <span class="notification-label">Candidate:</span>
          <span class="notification-value">${notif.username}</span>
        </div>
        <div class="notification-row">
          <span class="notification-label">Passcode:</span>
          <span class="notification-value">${notif.passcode}</span>
        </div>
        <div class="notification-row">
          <span class="notification-label">Mock ID:</span>
          <span class="notification-value">${notif.mockNumber}</span>
        </div>
        <div class="notification-row">
          <span class="notification-label">Date:</span>
          <span class="notification-value">${formatReadableTime(notif.time)}</span>
        </div>
      </div>
        `
      })

      testHistorySection.innerHTML = `<h2 class="notification-title">History of Candidates</h2>` + testHistoryList.outerHTML;



      assignedData.reverse().forEach((data)=>{
        const time = formatReadableTime(data.time);
        const itemHTML = `
          <div class="notification-item">
        <div class="notification-row">
          <span class="notification-label">Candidate:</span>
          <span class="notification-value">${data.username}</span>
        </div>
        <div class="notification-row">
          <span class="notification-label">Passcode:</span>
          <span class="notification-value">${data.passcode}</span>
        </div>
        <div class="notification-row">
          <span class="notification-label">Date:</span>
          <span class="notification-value">${time}</span>
        </div>
      </div>
        `

        if(data.status || data.mockInformation || !pass.some(p => p.pass == data.passcode)) {
          usedIdList.innerHTML += itemHTML;
        }


      })

      usedIdSection.innerHTML = `<h2 class="notification-title">Used IDs</h2>` + usedIdList.outerHTML;
      }

    }
    await renderNotifications();

}

      console.log(list);
      const userList = document.getElementById('userList');

      userList.innerHTML = '';

    function searchUsers() {
      const query = document.getElementById('search').value.toLowerCase();
      const userNodes = document.querySelectorAll(".user-card");
      
      userNodes.forEach(user=>{
        const text = user.textContent.toLowerCase();
        user.classList.toggle("hidden", !text.includes(query));
      })


    }

    function searchCandidates(){
      const query = document.getElementById('searchCandidates').value.toLowerCase();
      const candidateNodes = document.querySelectorAll(".assigned-item");

      candidateNodes.forEach(candidate=>{
        const text = candidate.textContent.toLowerCase();
        candidate.classList.toggle("hidden", !text.includes(query));
      })
    }

    function searchNotifs(){
      const query = document.getElementById('searchNotifs').value.toLowerCase();
      const notifNodes = document.querySelectorAll(".notification-item");
      
      notifNodes.forEach(notif=>{
        const text = notif.textContent.toLowerCase();
        notif.classList.toggle("hidden", !text.includes(query));
      })
      
    }
