<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Renewable Energy Share of Total Electricity Generation (2012, 2018, 2024)
  </text>
  <text x="425" y="60" text-anchor="middle" font-size="13" fill="#64748b">
    Proportion (%) in four European nations
  </text>

  <!-- Y-Axis Grid Lines & Labels -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4">
    <line x1="80" y1="380" x2="780" y2="380" stroke-dasharray="0" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="80" y1="320" x2="780" y2="320" />
    <line x1="80" y1="260" x2="780" y2="260" />
    <line x1="80" y1="200" x2="780" y2="200" />
    <line x1="80" y1="140" x2="780" y2="140" />
    <line x1="80" y1="80" x2="780" y2="80" />
  </g>

  <!-- Y-Axis Values -->
  <g font-size="12" fill="#64748b" text-anchor="end">
    <text x="70" y="385">0%</text>
    <text x="70" y="325">15%</text>
    <text x="70" y="265">30%</text>
    <text x="70" y="205">45%</text>
    <text x="70" y="145">60%</text>
    <text x="70" y="85">75%</text>
  </g>

  <!-- Legend -->
  <g transform="translate(310, 465)">
    <rect x="0" y="0" width="16" height="16" fill="#3b82f6" rx="3" />
    <text x="24" y="13" font-size="13" fill="#334155" font-weight="600">2012</text>

    <rect x="90" y="0" width="16" height="16" fill="#0d9488" rx="3" />
    <text x="114" y="13" font-size="13" fill="#334155" font-weight="600">2018</text>

    <rect x="180" y="0" width="16" height="16" fill="#f59e0b" rx="3" />
    <text x="204" y="13" font-size="13" fill="#334155" font-weight="600">2024</text>
  </g>

  <!-- Bars Group 1: Germany (2012: 24%, 2018: 38%, 2024: 53%) -->
  <!-- scale: 0% = 380, 75% = 80 => range = 300px for 75%, 4px per 1% -->
  <g transform="translate(110, 0)">
    <!-- 2012: 24% => height = 96px, y = 284 -->
    <rect x="0" y="284" width="36" height="96" fill="#3b82f6" rx="3" />
    <text x="18" y="278" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">24%</text>

    <!-- 2018: 38% => height = 152px, y = 228 -->
    <rect x="42" y="228" width="36" height="152" fill="#0d9488" rx="3" />
    <text x="60" y="222" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">38%</text>

    <!-- 2024: 53% => height = 212px, y = 168 -->
    <rect x="84" y="168" width="36" height="212" fill="#f59e0b" rx="3" />
    <text x="102" y="162" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">53%</text>

    <text x="60" y="405" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Germany</text>
  </g>

  <!-- Bars Group 2: Sweden (2012: 52%, 2018: 59%, 2024: 68%) -->
  <g transform="translate(280, 0)">
    <!-- 2012: 52% => height = 208px, y = 172 -->
    <rect x="0" y="172" width="36" height="208" fill="#3b82f6" rx="3" />
    <text x="18" y="166" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">52%</text>

    <!-- 2018: 59% => height = 236px, y = 144 -->
    <rect x="42" y="144" width="36" height="236" fill="#0d9488" rx="3" />
    <text x="60" y="138" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">59%</text>

    <!-- 2024: 68% => height = 272px, y = 108 -->
    <rect x="84" y="108" width="36" height="272" fill="#f59e0b" rx="3" />
    <text x="102" y="102" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">68%</text>

    <text x="60" y="405" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Sweden</text>
  </g>

  <!-- Bars Group 3: Spain (2012: 31%, 2018: 40%, 2024: 51%) -->
  <g transform="translate(450, 0)">
    <!-- 2012: 31% => height = 124px, y = 256 -->
    <rect x="0" y="256" width="36" height="124" fill="#3b82f6" rx="3" />
    <text x="18" y="250" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">31%</text>

    <!-- 2018: 40% => height = 160px, y = 220 -->
    <rect x="42" y="220" width="36" height="160" fill="#0d9488" rx="3" />
    <text x="60" y="214" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">40%</text>

    <!-- 2024: 51% => height = 204px, y = 176 -->
    <rect x="84" y="176" width="36" height="204" fill="#f59e0b" rx="3" />
    <text x="102" y="170" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">51%</text>

    <text x="60" y="405" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Spain</text>
  </g>

  <!-- Bars Group 4: United Kingdom (2012: 12%, 2018: 33%, 2024: 48%) -->
  <g transform="translate(620, 0)">
    <!-- 2012: 12% => height = 48px, y = 332 -->
    <rect x="0" y="332" width="36" height="48" fill="#3b82f6" rx="3" />
    <text x="18" y="326" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">12%</text>

    <!-- 2018: 33% => height = 132px, y = 248 -->
    <rect x="42" y="248" width="36" height="132" fill="#0d9488" rx="3" />
    <text x="60" y="242" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">33%</text>

    <!-- 2024: 48% => height = 192px, y = 188 -->
    <rect x="84" y="188" width="36" height="192" fill="#f59e0b" rx="3" />
    <text x="102" y="182" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">48%</text>

    <text x="60" y="405" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">United Kingdom</text>
  </g>
</svg>
