<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Riverside Park &amp; Town Centre Redevelopment (1995 vs. Present)">
  <rect width="760" height="440" fill="#ffffff" rx="10"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0b2b52">Riverside Park &amp; Town Centre Redevelopment (1995 vs. Present)</text>
  <text x="380" y="54" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b">Comparison of land use and public facilities</text>
  <text x="195" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0b2b52">1995</text>
     <text x="565" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0b2b52">Present</text>
     <!-- 1995 Map -->
     <rect x="40" y="102" width="310" height="270" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8"/>
     <rect x="40" y="322" width="310" height="50" fill="#bae6fd"/>
     <text x="195" y="352" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#0369a1">River Avon</text>
     <rect x="60" y="122" width="110" height="70" fill="#dcfce7" stroke="#16a34a" rx="4"/>
     <text x="115" y="162" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534">Woodland</text>
     <rect x="200" y="122" width="130" height="55" fill="#e2e8f0" stroke="#64748b" rx="4"/>
     <text x="265" y="154" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#334155">Old Factory</text>
     <rect x="60" y="220" width="120" height="65" fill="#fef3c7" stroke="#d97706" rx="4"/>
     <text x="120" y="257" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#92400e">Open Car Park</text>
     <rect x="210" y="220" width="120" height="65" fill="#fee2e2" stroke="#dc2626" rx="4"/>
     <text x="270" y="257" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#991b1b">Small Shops</text>
     <!-- Present Map -->
     <rect x="410" y="102" width="310" height="270" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8"/>
     <rect x="410" y="322" width="310" height="50" fill="#bae6fd"/>
     <text x="565" y="352" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#0369a1">River Avon + Boat Jetty</text>
     <rect x="430" y="122" width="110" height="70" fill="#dcfce7" stroke="#16a34a" rx="4"/>
     <text x="485" y="162" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#166534">Cycling Park</text>
     <rect x="570" y="122" width="130" height="65" fill="#dbeafe" stroke="#2563eb" rx="4"/>
     <text x="635" y="159" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1e40af">Art Museum</text>
     <rect x="430" y="220" width="130" height="65" fill="#fce7f3" stroke="#db2777" rx="4"/>
     <text x="495" y="257" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#9d174d">Riverside Cafes</text>
     <rect x="580" y="220" width="120" height="65" fill="#fee2e2" stroke="#dc2626" rx="4"/>
     <text x="640" y="257" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#991b1b">Shopping Mall</text>
