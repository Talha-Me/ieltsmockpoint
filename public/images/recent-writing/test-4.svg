<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Process diagram showing how rainwater is collected and treated for household drinking water">
  <rect width="760" height="440" fill="#ffffff" rx="10"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0b2b52">Rainwater Harvesting and Purification System for Drinking Water</text>
  <text x="380" y="54" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b">Six-stage domestic water treatment process</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0b2b52"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <g font-family="Inter,Arial,sans-serif">
    <!-- Stage 1 -->
    <rect x="45" y="92" width="185" height="96" rx="10" fill="#eff6ff" stroke="#0b2b52" stroke-width="1.8"/>
    <text x="137" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#e0202d">STAGE 1</text>
    <text x="137" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b2b52">Roof Catchment</text>
    <text x="137" y="158" text-anchor="middle" font-size="11.5" fill="#475569">Rain falls onto sloped</text>
    <text x="137" y="173" text-anchor="middle" font-size="11.5" fill="#475569">clean metal roof</text>

    <line x1="230" y1="140" x2="282" y2="140" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Stage 2 -->
    <rect x="287" y="92" width="185" height="96" rx="10" fill="#eff6ff" stroke="#0b2b52" stroke-width="1.8"/>
    <text x="379" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#e0202d">STAGE 2</text>
    <text x="379" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b2b52">Gutter &amp; Mesh Filter</text>
    <text x="379" y="158" text-anchor="middle" font-size="11.5" fill="#475569">Leaves and large debris</text>
    <text x="379" y="173" text-anchor="middle" font-size="11.5" fill="#475569">are screened out</text>

    <line x1="472" y1="140" x2="524" y2="140" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Stage 3 -->
    <rect x="529" y="92" width="185" height="96" rx="10" fill="#eff6ff" stroke="#0b2b52" stroke-width="1.8"/>
    <text x="621" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#e0202d">STAGE 3</text>
    <text x="621" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b2b52">Storage Tank</text>
    <text x="621" y="158" text-anchor="middle" font-size="11.5" fill="#475569">Underground dark tank</text>
    <text x="621" y="173" text-anchor="middle" font-size="11.5" fill="#475569">prevents algae growth</text>

    <!-- Connector down to Stage 4 -->
    <path d="M621,188 L621,230 L137,230 L137,264" fill="none" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Row 2 -->
    <!-- Stage 4 -->
    <rect x="45" y="270" width="185" height="96" rx="10" fill="#f0fdf4" stroke="#0d9488" stroke-width="1.8"/>
    <text x="137" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">STAGE 4</text>
    <text x="137" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b2b52">Sand &amp; Carbon Filter</text>
    <text x="137" y="336" text-anchor="middle" font-size="11.5" fill="#475569">Removes fine sediment,</text>
    <text x="137" y="351" text-anchor="middle" font-size="11.5" fill="#475569">odour, and chemicals</text>

    <line x1="230" y1="318" x2="282" y2="318" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Stage 5 -->
    <rect x="287" y="270" width="185" height="96" rx="10" fill="#f0fdf4" stroke="#0d9488" stroke-width="1.8"/>
    <text x="379" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">STAGE 5</text>
    <text x="379" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b2b52">UV Disinfection</text>
    <text x="379" y="336" text-anchor="middle" font-size="11.5" fill="#475569">Ultraviolet light kills</text>
    <text x="379" y="351" text-anchor="middle" font-size="11.5" fill="#475569">remaining bacteria</text>

    <line x1="472" y1="318" x2="524" y2="318" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Stage 6 -->
    <rect x="529" y="270" width="185" height="96" rx="10" fill="#fef2f2" stroke="#e0202d" stroke-width="1.8"/>
    <text x="621" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#e0202d">STAGE 6</text>
    <text x="621" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b2b52">Household Drinking Tap</text>
    <text x="621" y="336" text-anchor="middle" font-size="11.5" fill="#475569">Clean, safe potable</text>
    <text x="621" y="351" text-anchor="middle" font-size="11.5" fill="#475569">water pumped to taps</text>
  </g>
</svg>
