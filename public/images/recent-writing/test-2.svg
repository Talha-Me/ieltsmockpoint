<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Bar chart comparing weekly hours spent on digital media versus outdoor activities by age group">
  <rect width="760" height="440" fill="#ffffff" rx="10"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0b2b52">Weekly Time Spent on Digital Media vs. Outdoor Activities (2025)</text>
  <text x="380" y="54" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b">Average hours per week by age group in the UK</text>

  <!-- Gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="350" x2="690" y2="350"/>
    <line x1="90" y1="296" x2="690" y2="296"/>
    <line x1="90" y1="242" x2="690" y2="242"/>
    <line x1="90" y1="188" x2="690" y2="188"/>
    <line x1="90" y1="134" x2="690" y2="134"/>
    <line x1="90" y1="80" x2="690" y2="80"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#475569" text-anchor="end">
    <text x="80" y="354">0</text>
    <text x="80" y="300">8</text>
    <text x="80" y="246">16</text>
    <text x="80" y="192">24</text>
    <text x="80" y="138">32</text>
    <text x="80" y="84">40</text>
  </g>
  <text x="28" y="215" transform="rotate(-90 28 215)" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#334155">Hours per week</text>

  <line x1="90" y1="80" x2="90" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="350" x2="690" y2="350" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Scale: 40h = 270px -> 1h = 6.75px -->
  <!-- 18-24: Digital 34h (h=229.5, y=120.5), Outdoor 6h (h=40.5, y=309.5) -->
  <rect x="130" y="120.5" width="44" height="229.5" fill="#0b2b52" rx="3"/>
  <text x="152" y="114" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b2b52">34</text>
  <rect x="180" y="309.5" width="44" height="40.5" fill="#e0202d" rx="3"/>
  <text x="202" y="303" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0202d">6</text>
  <text x="177" y="374" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#334155">18–24</text>

  <!-- 25-44: Digital 26h (h=175.5, y=174.5), Outdoor 9h (h=60.75, y=289.25) -->
  <rect x="275" y="174.5" width="44" height="175.5" fill="#0b2b52" rx="3"/>
  <text x="297" y="168" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b2b52">26</text>
  <rect x="325" y="289.25" width="44" height="60.75" fill="#e0202d" rx="3"/>
  <text x="347" y="283" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0202d">9</text>
  <text x="322" y="374" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#334155">25–44</text>

  <!-- 45-64: Digital 18h (h=121.5, y=228.5), Outdoor 12h (h=81, y=269) -->
  <rect x="420" y="228.5" width="44" height="121.5" fill="#0b2b52" rx="3"/>
  <text x="442" y="222" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b2b52">18</text>
  <rect x="470" y="269" width="44" height="81" fill="#e0202d" rx="3"/>
  <text x="492" y="263" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0202d">12</text>
  <text x="467" y="374" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#334155">45–64</text>

  <!-- 65+: Digital 11h (h=74.25, y=275.75), Outdoor 14h (h=94.5, y=255.5) -->
  <rect x="565" y="275.75" width="44" height="74.25" fill="#0b2b52" rx="3"/>
  <text x="587" y="269" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b2b52">11</text>
  <rect x="615" y="255.5" width="44" height="94.5" fill="#e0202d" rx="3"/>
  <text x="637" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0202d">14</text>
  <text x="612" y="374" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#334155">65+</text>

  <!-- Legend -->
  <g transform="translate(225, 398)" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#0f172a">
    <rect x="0" y="0" width="16" height="16" fill="#0b2b52" rx="3"/><text x="24" y="13">Digital Media</text>
    <rect x="155" y="0" width="16" height="16" fill="#e0202d" rx="3"/><text x="179" y="13">Outdoor Activities</text>
  </g>
</svg>
