<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Geothermal Power Plant Electricity Generation Process">
  <rect width="760" height="440" fill="#ffffff" rx="10"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0b2b52">Geothermal Power Plant Electricity Generation Process</text>
  <text x="380" y="54" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b">Six-stage renewable steam cycle</text>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0b2b52"/></marker></defs>
  <line x1="230" y1="140" x2="282" y2="140" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="472" y1="140" x2="524" y2="140" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M621,188 L621,230 L137,230 L137,264" fill="none" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="230" y1="318" x2="282" y2="318" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="472" y1="318" x2="524" y2="318" stroke="#0b2b52" stroke-width="2" marker-end="url(#arr)"/><rect x="45" y="92" width="185" height="96" rx="10" fill="#eff6ff" stroke="#0b2b52" stroke-width="1.8"/><text x="137" y="116" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0202d">STAGE 1</text><text x="137" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2b52">Cold Water Injection</text><text x="137" y="158" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">Surface water pumped</text><text x="137" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">4.5 km underground</text><rect x="287" y="92" width="185" height="96" rx="10" fill="#eff6ff" stroke="#0b2b52" stroke-width="1.8"/><text x="379" y="116" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0202d">STAGE 2</text><text x="379" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2b52">Geothermal Heating</text><text x="379" y="158" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">Hot rocks superheat</text><text x="379" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">the underground water</text><rect x="529" y="92" width="185" height="96" rx="10" fill="#eff6ff" stroke="#0b2b52" stroke-width="1.8"/><text x="621" y="116" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0202d">STAGE 3</text><text x="621" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2b52">Production Well</text><text x="621" y="158" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">High-pressure steam</text><text x="621" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">rises to surface</text><rect x="45" y="270" width="185" height="96" rx="10" fill="#f0fdf4" stroke="#0d9488" stroke-width="1.8"/><text x="137" y="294" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0d9488">STAGE 4</text><text x="137" y="316" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2b52">Steam Turbine</text><text x="137" y="336" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">Steam spins turbine</text><text x="137" y="351" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">blades at high speed</text><rect x="287" y="270" width="185" height="96" rx="10" fill="#f0fdf4" stroke="#0d9488" stroke-width="1.8"/><text x="379" y="294" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0d9488">STAGE 5</text><text x="379" y="316" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2b52">Generator &amp; Grid</text><text x="379" y="336" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">Mechanical energy</text><text x="379" y="351" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">produces electricity</text><rect x="529" y="270" width="185" height="96" rx="10" fill="#fef2f2" stroke="#e0202d" stroke-width="1.8"/><text x="621" y="294" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#e0202d">STAGE 6</text><text x="621" y="316" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b2b52">Condenser Loop</text><text x="621" y="336" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">Cooling tower turns</text><text x="621" y="351" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.2" fill="#475569">steam back to water</text>
</svg>
