<style>
:root{--navy:#0b2b52;--blue:#1565c9;--blue-light:#eaf2fd;--red:#e0202d;--red-dark:#b5121d;--bg:#fff;--surface:#f4f7fb;--text:#0f2038;--muted:#5d708c;--line:#e3e9f3;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-padding-top:80px;scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);overflow-x:hidden;}
h1,h2,h3{font-family:'Sora',sans-serif;font-weight:700;line-height:1.1;color:var(--navy);}
a{color:inherit;}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px;}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;}
.reveal.in{opacity:1;transform:none;}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--red));z-index:200;}
#glow{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(21,101,201,.10),transparent 65%);pointer-events:none;z-index:0;transition:transform .12s linear;}
header{position:sticky;top:env(safe-area-inset-top,0);z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .25s;}
header.scrolled{box-shadow:0 6px 18px rgba(11,43,82,.08);}
nav.wrap{display:flex;align-items:center;justify-content:space-between;height:74px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Sora',sans-serif;font-weight:800;font-size:1.3rem;color:var(--navy);}
.brand img{height:46px;width:auto;display:block;}
.brand .txt{display:none;align-items:center;gap:8px;}
.brand .txt i{width:11px;height:11px;border-radius:3px;background:var(--red);box-shadow:5px 5px 0 var(--blue);margin-right:5px;}
.nav-links{display:flex;gap:22px;}
.nav-links a{font-size:.92rem;color:var(--muted);text-decoration:none;font-weight:500;position:relative;padding:4px 0;}
.nav-links a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--red);transition:width .2s;}
.nav-links a:hover,.nav-links a.cur{color:var(--navy);}.nav-links a:hover::after,.nav-links a.cur::after{width:100%;}
.nav-actions{display:flex;gap:12px;align-items:center;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:9px;font-size:.92rem;font-weight:700;text-decoration:none;border:1.5px solid transparent;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .2s,background .2s;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:var(--red-dark);transform:translateY(-2px);box-shadow:0 10px 22px rgba(224,32,45,.28);}
.btn-outline{color:var(--navy);border-color:var(--line);background:#fff;}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.menu-btn{display:none;background:var(--blue-light);border:none;color:var(--navy);width:42px;height:42px;border-radius:10px;font-size:1.3rem;cursor:pointer;}
@media(max-width:1000px){.nav-links,.nav-actions{display:none;}.menu-btn{display:block;}}
.overlay{position:fixed;inset:0;background:rgba(11,43,82,.55);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.open{opacity:1;pointer-events:auto;}
.sidebar{position:fixed;top:0;right:0;height:100%;width:min(320px,86vw);background:#fff;z-index:100;transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:22px 24px calc(24px + env(safe-area-inset-bottom,0));box-shadow:-12px 0 40px rgba(11,43,82,.18);}
.sidebar.open{transform:none;}
.sb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;padding-top:env(safe-area-inset-top,0);}
.sb-close{background:var(--surface);border:none;width:40px;height:40px;border-radius:50%;font-size:1.4rem;cursor:pointer;color:var(--navy);}
.sb-links a{display:block;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;color:var(--navy);transition:padding .2s,color .2s;}
.sb-links a:hover{color:var(--red);padding-left:12px;}
.sb-actions{margin-top:auto;display:grid;gap:10px;}
.kicker{display:inline-flex;align-items:center;gap:8px;color:var(--red);font-size:.88rem;font-weight:700;margin-bottom:16px;}
.kicker::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--red);}
main{position:relative;z-index:1;}

/* hero: centered editorial with typed word + falling pages */
.hero{position:relative;padding:76px 0 60px;overflow:hidden;text-align:center;}
.shape{position:absolute;border-radius:50%;z-index:0;}
.shape.a{top:-160px;left:-160px;width:520px;height:520px;background:radial-gradient(circle at 30% 30%,var(--blue-light),transparent 70%);animation:float 9s ease-in-out infinite;}
.shape.b{bottom:-160px;right:-120px;width:460px;height:460px;background:radial-gradient(circle at 70% 70%,rgba(224,32,45,.09),transparent 70%);animation:float 11s ease-in-out infinite reverse;}
@keyframes float{50%{transform:translateY(24px);}}
.pg{position:absolute;z-index:0;width:46px;height:60px;border-radius:7px;background:#fff;border:1.5px solid var(--line);box-shadow:0 10px 24px rgba(21,101,201,.12);opacity:.0;animation:drift 9s ease-in-out infinite;}
.pg::before{content:'';position:absolute;left:8px;right:8px;top:12px;height:3px;border-radius:2px;background:var(--blue-light);box-shadow:0 8px 0 var(--blue-light),0 16px 0 var(--blue-light),0 24px 0 #fdecee;}
.pg1{left:7%;top:14%;}.pg2{right:9%;top:22%;animation-delay:-3s;}.pg3{left:15%;bottom:12%;animation-delay:-5s;}.pg4{right:16%;bottom:10%;animation-delay:-7s;}
@keyframes drift{0%{opacity:0;transform:translateY(-30px) rotate(-12deg);}25%{opacity:1;}75%{opacity:1;}100%{opacity:0;transform:translateY(46px) rotate(14deg);}}
.hero-in{position:relative;z-index:1;max-width:820px;margin:0 auto;}
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:22px;}
.crumbs a{text-decoration:none;color:var(--blue);font-weight:600;}
.hero h1{font-size:clamp(2.1rem,4.4vw,3.4rem);margin-bottom:20px;}
.swap{display:inline-block;color:var(--blue);position:relative;min-width:2ch;}
.swap::after{content:'';display:inline-block;width:3px;height:.9em;background:var(--red);margin-left:4px;vertical-align:-.1em;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.hero p.lead{color:var(--muted);font-size:1.06rem;max-width:58ch;margin:0 auto 30px;}
.search{display:flex;align-items:center;gap:6px;max-width:560px;margin:0 auto;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:0 18px 40px rgba(11,43,82,.1);transition:border-color .2s,box-shadow .2s;}
.search:focus-within{border-color:var(--blue);box-shadow:0 18px 40px rgba(21,101,201,.2);}
.search svg{width:18px;height:18px;color:var(--muted);flex:none;}
.search input{flex:1;border:none;outline:none;font-family:inherit;font-size:.95rem;color:var(--text);background:transparent;padding:10px 4px;min-width:0;}
.search .btn{border-radius:999px;}
.trend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;font-size:.8rem;color:var(--muted);align-items:center;}
.trend button{font-family:inherit;font-size:.78rem;font-weight:700;color:var(--blue);background:var(--blue-light);border:1px solid #d3e4fa;border-radius:8px;padding:5px 11px;cursor:pointer;transition:all .2s;}
.trend button:hover{background:var(--navy);color:#fff;border-color:var(--navy);transform:translateY(-2px);}
@media(max-width:700px){.pg{display:none;}}
section{padding:70px 0;border-top:1px solid var(--line);}
.section-head{max-width:62ch;margin-bottom:38px;}
.section-head h2{font-size:clamp(1.6rem,2.8vw,2.2rem);}
.section-head p{color:var(--muted);margin-top:14px;}

/* category pills with sliding indicator */
.cats{position:relative;display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;margin:0 auto 34px;flex-wrap:wrap;width:fit-content;max-width:100%;justify-content:center;}
.cat{position:relative;z-index:1;background:transparent;border:none;border-radius:999px;padding:10px 18px;font-family:'Sora',sans-serif;font-weight:700;font-size:.84rem;color:var(--muted);cursor:pointer;transition:color .25s;}
.cat:hover{color:var(--blue);}
.cat.active{color:#fff;}
.cat-ind{position:absolute;z-index:0;top:6px;left:0;height:calc(100% - 12px);border-radius:999px;background:var(--navy);box-shadow:0 10px 22px rgba(11,43,82,.22);transition:left .35s cubic-bezier(.4,0,.2,1),width .35s cubic-bezier(.4,0,.2,1);}
.count{text-align:center;color:var(--muted);font-size:.88rem;margin:-16px 0 26px;min-height:1.3em;}
.count b{color:var(--navy);}

/* featured + grid */
.feat{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border:1.5px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;margin-bottom:26px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;padding:0;width:100%;transition:transform .3s,box-shadow .3s,border-color .3s;opacity:0;transform:translateY(18px);animation:qin .6s cubic-bezier(.2,.8,.2,1) forwards;}
.feat:hover{transform:translateY(-6px);border-color:var(--blue);box-shadow:0 26px 50px rgba(21,101,201,.15);}
.feat .im{position:relative;overflow:hidden;min-height:300px;background:var(--surface);}
.feat .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s;}
.feat:hover .im img{transform:scale(1.06);}
.feat .tx{padding:38px;display:flex;flex-direction:column;justify-content:center;}
.feat h3{font-size:clamp(1.4rem,2.4vw,1.9rem);line-height:1.2;margin:14px 0;}
.feat p{color:var(--muted);margin-bottom:20px;}
.flag{position:absolute;left:16px;top:16px;z-index:2;background:var(--red);color:#fff;font-size:.7rem;font-weight:800;padding:5px 12px;border-radius:999px;}
@media(max-width:820px){.feat{grid-template-columns:1fr;}.feat .im{min-height:220px;}.feat .tx{padding:26px;}}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;min-height:200px;}
.post{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;font-family:inherit;color:inherit;padding:0;opacity:0;transform:translateY(18px) rotate(.6deg);animation:qin .55s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .3s,border-color .25s,box-shadow .25s;}
@keyframes qin{to{opacity:1;transform:none;}}
.post:hover{transform:translateY(-8px) rotate(-.4deg);border-color:var(--blue);box-shadow:0 22px 44px rgba(21,101,201,.14);}
.post .im{height:190px;overflow:hidden;background:var(--surface);position:relative;}
.post .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s;}
.post:hover .im img{transform:scale(1.08);}
.post .im::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:100%;background:linear-gradient(90deg,var(--blue),var(--red));transform:scaleX(0);transform-origin:left;transition:transform .4s;}
.post:hover .im::after{transform:scaleX(1);}
.pb{padding:22px;display:flex;flex-direction:column;flex:1;}
.prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;}
.tag{font-size:.7rem;font-weight:800;color:var(--red);background:#fdecee;border-radius:6px;padding:3px 9px;}
.rt{font-size:.74rem;font-weight:600;color:var(--muted);}
.post h3{font-size:1.05rem;line-height:1.3;margin-bottom:8px;}
.post p{font-size:.85rem;color:var(--muted);flex:1;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.pf{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:.8rem;font-weight:700;color:var(--blue);}
.pf span:last-child{color:var(--muted);font-weight:600;}
.pf i{font-style:normal;display:inline-block;transition:transform .25s;}
.post:hover .pf i,.feat:hover .pf i{transform:translateX(6px);}
.skel{height:340px;border-radius:20px;background:linear-gradient(90deg,var(--surface),#fff,var(--surface));background-size:200% 100%;animation:sk 1.2s linear infinite;border:1px solid var(--line);}
@keyframes sk{to{background-position:-200% 0;}}
.empty{grid-column:1/-1;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:44px 24px;color:var(--muted);}
.empty h3{margin-bottom:8px;}

/* topics + cta + about + faq */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;text-decoration:none;transition:transform .2s,border-color .2s,background .2s;}
.tcard:hover{transform:translateY(-6px);border-color:var(--blue);background:#fff;}
.tcard h3{font-size:1.05rem;margin-bottom:8px;}.tcard p{font-size:.86rem;color:var(--muted);}
@media(max-width:900px){.tgrid{grid-template-columns:1fr 1fr;}}@media(max-width:520px){.tgrid{grid-template-columns:1fr;}}
.mock{position:relative;overflow:hidden;border-radius:26px;padding:56px 48px;color:#fff;background:linear-gradient(120deg,#0b2b52,#1565c9,#0b2b52,#b5121d);background-size:300% 300%;animation:flow 12s ease infinite;}
@keyframes flow{50%{background-position:100% 50%;}}
.mock .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:float 8s ease-in-out infinite;width:260px;height:260px;top:-90px;right:-60px;}
.mock-in{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;}
.mock h2{color:#fff;font-size:clamp(1.8rem,3.2vw,2.5rem);margin-bottom:14px;}
.mock p{color:rgba(255,255,255,.82);max-width:46ch;margin-bottom:28px;}
.mock .btn-red{padding:15px 30px;font-size:1rem;animation:ring 2.2s infinite;}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5);}70%{box-shadow:0 0 0 16px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
.links{display:grid;gap:10px;}
.links a{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:14px 18px;color:#fff;text-decoration:none;font-weight:600;font-size:.92rem;transition:background .2s,transform .2s;}
.links a:hover{background:rgba(255,255,255,.2);transform:translateX(6px);}

.about{display:grid;grid-template-columns:1fr 1fr;gap:34px 48px;}
.about h3{font-size:1.15rem;margin-bottom:10px;}
.about p{color:var(--muted);font-size:.94rem;margin-bottom:10px;}
.about a{color:var(--blue);font-weight:600;}

.faq{border-top:1px solid var(--line);}
.faq details{border-bottom:1px solid var(--line);padding:20px 0;}

.rp{position:sticky;top:0;z-index:5;height:4px;background:var(--line);}

#mCover{display:none;width:100%;max-height:420px;object-fit:cover;border-radius:16px;margin-bottom:26px;}
.body h2{margin:2rem 0 .8rem;font-size:1.5rem;}

<script>

const sb=$('sb'),ov=$('ov');
function setMenu(o){sb.classList.toggle('open',o);ov.classList.toggle('open',o);sb.setAttribute('aria-hidden',!o);document.body.style.overflow=o?'hidden':'';}
$('openMenu').onclick=()=>setMenu(true);$('closeMenu').onclick=()=>setMenu(false);ov.onclick=()=>setMenu(false);
sb.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setMenu(false)));
matchMedia('(min-width:1001px)').addEventListener('change',e=>{if(e.matches)setMenu(false);});
const rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rio.unobserve(e.target);}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(i%4)*70+'ms';rio.observe(el);});
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce)addEventListener('mousemove',e=>{$('glow').style.transform=`translate(${e.clientX}px,${e.clientY}px)`;},{passive:true});

/* typed word in hero */
const sw=$('swap'),W=['Reading','Listening','Writing','Speaking','Band 8'];
if(reduce){sw.textContent='IELTS';}else{
  let wi=0,ci=W[0].length,del=true;
  (function t(){const w=W[wi];
    if(del){ci--;sw.textContent=w.slice(0,ci);if(ci<=0){del=false;wi=(wi+1)%W.length;}setTimeout(t,55);}
    else{const n=W[wi];ci++;sw.textContent=n.slice(0,ci);if(ci>=n.length){del=true;setTimeout(t,1700);}else setTimeout(t,95);}
  })();
  setTimeout(()=>{},0);
}

/* categories (values match your API) */
const CATS=[['All','All topics'],['Tips & Tricks','Tips & Tricks'],['Reading Strategy','Reading'],['Listening Strategy','Listening'],['Writing Band 8','Writing'],['Speaking Secrets','Speaking'],['Vocabulary','Vocabulary']];
let cat='All',blogs=[],token=0;
const cats=$('cats'),ind=$('ind');
CATS.forEach((c,i)=>{
  const b=document.createElement('button');b.className='cat'+(i?'':' active');b.textContent=c[1];b.dataset.v=c[0];b.setAttribute('role','tab');b.setAttribute('aria-selected',!i);
  b.onclick=()=>{cats.querySelectorAll('.cat').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected',false);});b.classList.add('active');b.setAttribute('aria-selected',true);cat=c[0];moveInd();fetchBlogs();};
  cats.appendChild(b);
});
function moveInd(){const a=cats.querySelector('.cat.active');if(!a)return;ind.style.left=a.offsetLeft+'px';ind.style.width=a.offsetWidth+'px';}

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);

/* search */

let dt;$('q').addEventListener('input',()=>{clearTimeout(dt);dt=setTimeout(fetchBlogs,450);});
document.querySelectorAll('.trend button').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.q;fetchBlogs();$('articles').scrollIntoView({behavior:'smooth'});});

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FALL='https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=800&auto=format&fit=crop&q=80';
const grid=$('grid'),fb=$('featBox'),cnt=$('count');

async function fetchBlogs(){
  const t=++token,s=$('q').value.trim();
  fb.innerHTML='';grid.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';cnt.textContent='';
  let url='/api/blogs?';
  if(cat!=='All')url+='category='+encodeURIComponent(cat)+'&';
  if(s)url+='search='+encodeURIComponent(s);
  try{
    const r=await fetch(url),d=await r.json();
    if(t!==token)return;
    if(d.success&&d.data.length){blogs=d.data;render(s);schema();}
    else{blogs=[];fb.innerHTML='';grid.innerHTML='<div class="empty"><h3>No articles found</h3><p>Try another topic or search term, or browse <a href="learn.html" style="color:var(--blue);font-weight:600">free IELTS lessons</a>.</p></div>';}
  }catch(e){
    if(t!==token)return;
    fb.innerHTML='';grid.innerHTML='<div class="empty"><h3>Articles could not load</h3><p>Check your connection and reload the page.</p></div>';
  }
}
function card(b,i,cls){
  return `<button class="${cls}" style="animation-delay:${i*60}ms" data-i="${i}" aria-label="Read article: ${esc(b.title)}">
    <div class="im"><img src="${esc(b.thumbnail||FALL)}" alt="${esc(b.title)}" loading="lazy">${cls==='feat'?'<span class="flag">Latest</span>':''}</div>
    <div class="${cls==='feat'?'tx':'pb'}">
      <div class="prow"><span class="tag">${esc(b.category)}</span><span class="rt">${esc(b.readTimeMinutes||5)} min read</span></div>
      <h3>${esc(b.title)}</h3>
      <p>${esc(b.excerpt||'Read this complete walkthrough to improve your exam confidence.')}</p>
      <div class="pf"><span>Read full guide <i>→</i></span><span>${b.createdAt?new Date(b.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''}</span></div>
    </div></button>`;
}
function render(s){
  const showFeat=cat==='All'&&!s&&blogs.length>2;
  cnt.innerHTML=`<b>${blogs.length}</b> ${blogs.length===1?'article':'articles'}${s?' for “'+esc(s)+'”':''}`;
  fb.innerHTML=showFeat?card(blogs[0],0,'feat'):'';
  const rest=showFeat?blogs.slice(1):blogs,off=showFeat?1:0;
  grid.innerHTML=rest.map((b,i)=>card(b,i+off,'post')).join('');
  document.querySelectorAll('.feat,.post').forEach(c=>c.onclick=()=>openArticle(+c.dataset.i));
}
function schema(){
  const items=blogs.slice(0,10).map((b,i)=>({"@type":"ListItem","position":i+1,"item":{"@type":"BlogPosting","headline":b.title,"description":b.excerpt||'',"image":b.thumbnail||undefined,"datePublished":b.createdAt||undefined,"author":{"@type":"Person","name":(b.author&&b.author.name)||'IELTS Mockpoint Team'},"articleSection":b.category}}));

}

/* reader */

  $('rpi').style.width='0';box.scrollTop=0;
  lm.classList.add('open');lm.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
}
function closeArticle(){lm.classList.remove('open');lm.setAttribute('aria-hidden','true');document.body.style.overflow='';}
box.addEventListener('scroll',()=>{const h=box.scrollHeight-box.clientHeight;$('rpi').style.width=(h>0?box.scrollTop/h*100:0)+'%';},{passive:true});
$('lmClose').onclick=closeArticle;$('lmDone').onclick=closeArticle;
lm.addEventListener('click',e=>{if(e.target===lm)closeArticle();});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeArticle();setMenu(false);}});

fetchBlogs();
