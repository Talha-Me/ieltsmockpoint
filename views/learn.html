<style>
:root{--navy:#0b2b52;--blue:#1565c9;--blue-light:#eaf2fd;--red:#e0202d;--red-dark:#b5121d;--bg:#fff;--surface:#f4f7fb;--text:#0f2038;--muted:#5d708c;--line:#e3e9f3;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-padding-top:80px;scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);overflow-x:hidden;}
h1,h2,h3{font-family:'Sora',sans-serif;font-weight:700;line-height:1.1;color:var(--navy);}
a{color:inherit;}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px;}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;}
.reveal.in{opacity:1;transform:none;}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--red));z-index:200;}
#glow{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(21,101,201,.10),transparent 65%);pointer-events:none;z-index:0;transition:transform .12s linear;}
header{position:sticky;top:env(safe-area-inset-top,0);z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .25s;}
header.scrolled{box-shadow:0 6px 18px rgba(11,43,82,.08);}
nav.wrap{display:flex;align-items:center;justify-content:space-between;height:74px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Sora',sans-serif;font-weight:800;font-size:1.3rem;color:var(--navy);}
.brand img{height:46px;width:auto;display:block;}
.brand .txt{display:none;align-items:center;gap:8px;}
.brand .txt i{width:11px;height:11px;border-radius:3px;background:var(--red);box-shadow:5px 5px 0 var(--blue);margin-right:5px;}
.nav-links{display:flex;gap:22px;}
.nav-links a{font-size:.92rem;color:var(--muted);text-decoration:none;font-weight:500;position:relative;padding:4px 0;}
.nav-links a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--red);transition:width .2s;}
.nav-links a:hover,.nav-links a.cur{color:var(--navy);}.nav-links a:hover::after,.nav-links a.cur::after{width:100%;}
.nav-actions{display:flex;gap:12px;align-items:center;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:9px;font-size:.92rem;font-weight:700;text-decoration:none;border:1.5px solid transparent;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .2s,background .2s;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:var(--red-dark);transform:translateY(-2px);box-shadow:0 10px 22px rgba(224,32,45,.28);}
.btn-outline{color:var(--navy);border-color:var(--line);background:#fff;}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.menu-btn{display:none;background:var(--blue-light);border:none;color:var(--navy);width:42px;height:42px;border-radius:10px;font-size:1.3rem;cursor:pointer;}
@media(max-width:1000px){.nav-links,.nav-actions{display:none;}.menu-btn{display:block;}}
.overlay{position:fixed;inset:0;background:rgba(11,43,82,.55);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.open{opacity:1;pointer-events:auto;}
.sidebar{position:fixed;top:0;right:0;height:100%;width:min(320px,86vw);background:#fff;z-index:100;transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:22px 24px calc(24px + env(safe-area-inset-bottom,0));box-shadow:-12px 0 40px rgba(11,43,82,.18);}
.sidebar.open{transform:none;}
.sb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;padding-top:env(safe-area-inset-top,0);}
.sb-close{background:var(--surface);border:none;width:40px;height:40px;border-radius:50%;font-size:1.4rem;cursor:pointer;color:var(--navy);}
.sb-links a{display:block;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;color:var(--navy);transition:padding .2s,color .2s;}
.sb-links a:hover{color:var(--red);padding-left:12px;}
.sb-actions{margin-top:auto;display:grid;gap:10px;}
.kicker{display:inline-flex;align-items:center;gap:8px;color:var(--red);font-size:.88rem;font-weight:700;margin-bottom:16px;}
.kicker::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--red);}
main{position:relative;z-index:1;}
.hero{position:relative;padding:70px 0 54px;overflow:hidden;}
.shape{position:absolute;border-radius:50%;z-index:0;}
.shape.a{top:-140px;right:-160px;width:540px;height:540px;background:radial-gradient(circle at 30% 30%,var(--blue-light),transparent 70%);animation:float 9s ease-in-out infinite;}
.shape.b{top:80px;right:-60px;width:420px;height:420px;background:radial-gradient(circle at 70% 70%,rgba(224,32,45,.09),transparent 70%);animation:float 11s ease-in-out infinite reverse;}
@keyframes float{50%{transform:translateY(24px);}}
.crumbs{position:relative;z-index:1;font-size:.82rem;color:var(--muted);margin-bottom:22px;}
.crumbs a{text-decoration:none;color:var(--blue);font-weight:600;}
.hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;}
.hero h1{font-size:clamp(2.1rem,4.1vw,3.2rem);margin-bottom:20px;}
.hero h1 .accent{color:var(--blue);position:relative;}
.hero h1 .accent::after{content:'';position:absolute;left:0;bottom:-4px;height:6px;width:100%;background:rgba(224,32,45,.25);border-radius:4px;transform:scaleX(0);transform-origin:left;animation:ul 1s .8s forwards;}
@keyframes ul{to{transform:scaleX(1);}}
.hero p.lead{color:var(--muted);font-size:1.06rem;max-width:52ch;margin-bottom:24px;}
.trust{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;}
.trust span{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;}
.trust svg{width:14px;height:14px;color:var(--red);}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;}
.hero-card{position:relative;background:var(--navy);border-radius:20px;padding:30px;color:#fff;overflow:hidden;box-shadow:0 30px 60px rgba(11,43,82,.25);animation:hcard 6s ease-in-out infinite;}
@keyframes hcard{50%{transform:translateY(-8px);}}
.hero-card::after{content:'';position:absolute;bottom:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(224,32,45,.28);}
.hero-card h2{color:#fff;font-size:1.15rem;margin-bottom:6px;}
.hero-card p{color:rgba(255,255,255,.7);font-size:.88rem;margin-bottom:16px;}
.mini-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12);position:relative;z-index:1;}
.mini-row strong{color:var(--blue-light);min-width:28px;text-align:right;}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr;}}
.marq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);overflow:hidden;padding:16px 0;}
.marq-track{display:flex;gap:14px;width:max-content;animation:marq 40s linear infinite;}
.marq:hover .marq-track{animation-play-state:paused;}
.marq span{font-family:'Sora',sans-serif;font-weight:600;font-size:.86rem;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 18px;white-space:nowrap;}
.marq span:nth-child(3n){color:var(--red);}.marq span:nth-child(3n+1){color:var(--blue);}
@keyframes marq{to{transform:translateX(-50%);}}
section{padding:76px 0;border-top:1px solid var(--line);}
.section-head{max-width:62ch;margin-bottom:42px;}
.section-head h2{font-size:clamp(1.6rem,2.8vw,2.2rem);}
.section-head p{color:var(--muted);margin-top:14px;}

/* module tabs */
.qt-tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:22px;flex-wrap:wrap;width:fit-content;max-width:100%;}
.qt-tab{display:inline-flex;align-items:center;gap:10px;background:transparent;border:none;border-radius:11px;padding:11px 20px;font-family:'Sora',sans-serif;font-weight:700;font-size:.9rem;color:var(--muted);cursor:pointer;transition:color .25s,background .25s;}
.qt-tab svg{width:18px;height:18px;}
.qt-tab:hover{color:var(--blue);}
.qt-tab.active{background:var(--navy);color:#fff;box-shadow:0 10px 22px rgba(11,43,82,.22);}
.mod-info{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:26px;}
.mod-info h3{font-size:1.25rem;margin-bottom:6px;}
.mod-info p{color:var(--muted);font-size:.92rem;max-width:62ch;}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
.topics a{font-size:.78rem;font-weight:700;color:var(--blue);background:var(--blue-light);border:1px solid #d3e4fa;border-radius:8px;padding:5px 11px;text-decoration:none;transition:all .2s;}
.topics a:hover{background:var(--navy);color:#fff;border-color:var(--navy);transform:translateY(-2px);}

/* lesson cards */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;min-height:200px;}
.lesson{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;opacity:0;transform:translateY(16px) scale(.97);animation:qin .5s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .25s,border-color .25s,box-shadow .25s;text-align:left;font-family:inherit;color:inherit;padding:0;}
@keyframes qin{to{opacity:1;transform:none;}}
.lesson::before{content:'';position:absolute;left:0;top:0;height:4px;width:100%;background:linear-gradient(90deg,var(--blue),var(--red));transform:scaleX(0);transform-origin:left;transition:transform .35s;z-index:2;}
.lesson:hover{transform:translateY(-6px);border-color:var(--blue);box-shadow:0 20px 40px rgba(21,101,201,.13);}
.lesson:hover::before{transform:scaleX(1);}
.lesson img{width:100%;height:170px;object-fit:cover;background:var(--surface);display:block;}
.lbody{padding:22px;display:flex;flex-direction:column;flex:1;}
.lrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;}
.tag{font-size:.7rem;font-weight:800;color:var(--red);background:#fdecee;border-radius:6px;padding:3px 9px;}
.diff{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;}
.lesson h3{font-size:1.05rem;margin-bottom:8px;line-height:1.25;}
.lesson p{font-size:.85rem;color:var(--muted);flex:1;margin-bottom:16px;}
.lfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:.82rem;font-weight:700;color:var(--blue);}
.lfoot em{font-style:normal;font-size:.7rem;background:var(--blue-light);border-radius:999px;padding:3px 10px;}
.skel{height:300px;border-radius:20px;background:linear-gradient(90deg,var(--surface),#fff,var(--surface));background-size:200% 100%;animation:sk 1.2s linear infinite;border:1px solid var(--line);}
@keyframes sk{to{background-position:-200% 0;}}
.empty{grid-column:1/-1;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:44px 24px;color:var(--muted);}
.empty h3{margin-bottom:8px;}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px;transition:transform .2s,border-color .2s,background .2s;}
.step:hover{transform:translateY(-6px);border-color:var(--blue);background:#fff;}
.step .num{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;background:var(--navy);color:#fff;font-family:'Sora',sans-serif;font-size:.9rem;margin-bottom:14px;box-shadow:4px 4px 0 var(--red);}
.step h3{font-size:1.2rem;margin-bottom:8px;}.step p{color:var(--muted);font-size:.94rem;}
@media(max-width:760px){.steps{grid-template-columns:1fr;}}

/* mock cta */
.mock{position:relative;overflow:hidden;border-radius:26px;padding:56px 48px;color:#fff;background:linear-gradient(120deg,#0b2b52,#1565c9,#0b2b52,#b5121d);background-size:300% 300%;animation:flow 12s ease infinite;}
@keyframes flow{50%{background-position:100% 50%;}}
.mock .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:float 8s ease-in-out infinite;width:260px;height:260px;top:-90px;right:-60px;}
.mock-in{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;}
.mock h2{color:#fff;font-size:clamp(1.8rem,3.2vw,2.5rem);margin-bottom:14px;}
.mock p{color:rgba(255,255,255,.82);max-width:46ch;margin-bottom:28px;}
.mock .btn-red{padding:15px 30px;font-size:1rem;animation:ring 2.2s infinite;}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5);}70%{box-shadow:0 0 0 16px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
.links{display:grid;gap:10px;}
.links a{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:14px 18px;color:#fff;text-decoration:none;font-weight:600;font-size:.92rem;transition:background .2s,transform .2s;}
.links a:hover{background:rgba(255,255,255,.2);transform:translateX(6px);}
@media(max-width:820px){.mock{padding:36px 26px;}.mock-in{grid-template-columns:1fr;}}

.about{display:grid;grid-template-columns:1fr 1fr;gap:34px 48px;}
.about h3{font-size:1.15rem;margin-bottom:10px;}
.about p{color:var(--muted);font-size:.94rem;margin-bottom:10px;}
.about a{color:var(--blue);font-weight:600;}
@media(max-width:760px){.about{grid-template-columns:1fr;}}
.faq{border-top:1px solid var(--line);}
.faq details{border-bottom:1px solid var(--line);padding:20px 0;}
.faq summary{cursor:pointer;font-weight:600;font-size:1.02rem;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--navy);}
.faq summary::-webkit-details-marker{display:none;}
.faq summary::after{content:'+';color:var(--red);font-size:1.4rem;}
.faq details[open] summary::after{content:'−';}
.faq details p{color:var(--muted);margin-top:12px;font-size:.94rem;max-width:64ch;}

/* lesson modal */
.lm{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(11,43,82,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;}
.lm.open{opacity:1;pointer-events:auto;}
.lm-box{background:#fff;border-radius:22px;width:min(920px,100%);max-height:90vh;overflow:auto;padding:32px 36px;transform:translateY(20px) scale(.98);transition:transform .3s;box-shadow:0 30px 70px rgba(11,43,82,.35);position:relative;}
.lm.open .lm-box{transform:none;}
.lm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}

.lm h2{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:18px;}
.audio-box{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:22px;display:none;}

.audio-box audio{width:100%;}

.lm-content h2,.lm-content h3{margin:1.4rem 0 .7rem;}

.lm-content img{max-width:100%;border-radius:12px;}
.lm-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}

footer{border-top:1px solid var(--line);padding:56px 0 32px;background:var(--surface);position:relative;z-index:1;}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.1fr;gap:32px;margin-bottom:36px;}
.fgrid h4{font-size:.88rem;color:var(--blue);margin-bottom:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.fgrid a{display:block;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:10px;transition:color .15s;}
.fgrid a.brand{display:flex;color:var(--navy);}
.fgrid a:hover{color:var(--red);}
